# ==============================================================================
# SoniLab - Despliegue de Prometheus y Grafana con Auto-Provisioning (E10)
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: sonilab
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://sonilab-prometheus:9090
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: sonilab
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'SoniLab Dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonilab-prometheus
  namespace: sonilab
  labels:
    app: sonilab-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonilab-prometheus
  template:
    metadata:
      labels:
        app: sonilab-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: alerts
              mountPath: /etc/prometheus/alert-rules.yml
              subPath: alert-rules.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-sonilab-config
        - name: alerts
          configMap:
            name: prometheus-sonilab-alerts
---
apiVersion: v1
kind: Service
metadata:
  name: sonilab-prometheus
  namespace: sonilab
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: sonilab-prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonilab-grafana
  namespace: sonilab
  labels:
    app: sonilab-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonilab-grafana
  template:
    metadata:
      labels:
        app: sonilab-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin1234"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards-json
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards-json
          configMap:
            name: sonilab-grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: sonilab-grafana
  namespace: sonilab
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: sonilab-grafana
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-netpol
  namespace: sonilab
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - sonilab-grafana
          - sonilab-prometheus
          - postgres-exporter
          - mongodb-exporter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - {}

