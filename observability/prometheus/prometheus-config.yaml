apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-sonilab-config
  namespace: sonilab
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert-rules.yml

    scrape_configs:
      - job_name: 'sonilab-backend'
        static_configs:
          - targets: ['sonilab-backend.sonilab.svc.cluster.local:3000']
        metrics_path: /metrics

      - job_name: 'postgres-exporter'
        static_configs:
          - targets: ['postgres-exporter.sonilab.svc.cluster.local:9187']

      - job_name: 'mongodb-exporter'
        static_configs:
          - targets: ['mongodb-exporter.sonilab.svc.cluster.local:9216']
