# Topología Ambiente Productivo de Laboratorio (1 control-plane + 2 workers) - Sección 3
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sonilab-prod
networking:
  disableDefaultCNI: true # Permite instalar Calico CNI para hacer cumplir NetworkPolicies (E08)
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 9080
        protocol: TCP
      - containerPort: 443
        hostPort: 9443
        protocol: TCP
  - role: worker
  - role: worker
