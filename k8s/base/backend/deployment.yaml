apiVersion: v1
kind: ConfigMap
metadata:
  name: sonilab-backend-config
  namespace: sonilab
data:
  PORT: "3000"
  PG_HOST: "sonilab-postgres"
  PG_PORT: "5432"
  PG_DATABASE: "sonilab_db"
---
apiVersion: v1
kind: Service
metadata:
  name: sonilab-backend
  namespace: sonilab
  labels:
    app: sonilab-backend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: sonilab-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonilab-backend
  namespace: sonilab
  labels:
    app: sonilab-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonilab-backend
  template:
    metadata:
      labels:
        app: sonilab-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sonilab-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: sonilab-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: sonilab-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sonilab-db-secrets
                  key: DATABASE_URL
                  optional: true
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: sonilab-db-secrets
                  key: MONGO_URL
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sonilab-db-secrets
                  key: JWT_SECRET
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
            failureThreshold: 15
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: tmp-dir
          emptyDir: {}
