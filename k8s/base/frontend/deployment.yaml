apiVersion: v1
kind: Service
metadata:
  name: sonilab-frontend
  namespace: sonilab
  labels:
    app: sonilab-frontend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: sonilab-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonilab-frontend
  namespace: sonilab
  labels:
    app: sonilab-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonilab-frontend
  template:
    metadata:
      labels:
        app: sonilab-frontend
    spec:
      serviceAccountName: sonilab-frontend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: sonilab-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
