apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sonilab-backend-pdb
  namespace: sonilab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sonilab-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sonilab-frontend-pdb
  namespace: sonilab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sonilab-frontend
