apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sonilab

resources:
  - ../../base
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

labels:
  - pairs:
      environment: prod

replicas:
  - name: sonilab-backend
    count: 2
  - name: sonilab-frontend
    count: 2

patches:
  - path: patches-ha.yaml
