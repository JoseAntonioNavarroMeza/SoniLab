apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonilab-ingress
  namespace: sonilab
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dev.sonilab.local
      secretName: sonilab-dev-tls
  rules:
    - host: dev.sonilab.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sonilab-backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonilab-frontend
                port:
                  number: 8080
